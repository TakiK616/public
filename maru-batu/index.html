                <span class="w-16 text-center">判定</span>
            </div>
        </div>

        <!-- QUESTIONS GRID -->
        <div id="questions-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
            <!-- Dynamic questions -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden py-16 text-center bg-white rounded-2xl border border-slate-200 mt-4">
            <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <p class="text-slate-500 font-semibold text-sm">該当する問題が見つかりません</p>
            <p class="text-xs text-slate-400 mt-1">フィルターを変更するか「すべて」を選択してください。</p>
        </div>

    </main>

    <!-- STICKY FOOTER BAR -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-3.5 z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.08)]">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">入力状況</span>
                    <span class="text-xs font-bold text-slate-700">
                        解答: <span id="footer-user-count" class="text-blue-600">0</span>/<span class="footer-total">50</span> | 
                        正解: <span id="footer-key-count" class="text-indigo-600">0</span>/<span class="footer-total">50</span>
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="grade-btn" onclick="gradeAll()" class="px-8 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>採点する</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-200" id="settings-modal-card">
            
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    設定
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">問題数 (1〜100)</label>
                    <input type="number" id="setting-q-count" min="1" max="100" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">解答形式</label>
                    <select id="setting-format" onchange="toggleChoicesSelect()" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 appearance-none">
                        <option value="OX">〇・×</option>
                        <option value="ALPHA">A・B・C・D... (アルファベット)</option>
                        <option value="NUM">1・2・3・4... (数字)</option>
                    </select>
                </div>

                <div id="setting-choices-container" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">選択肢の数 (卓数)</label>
                    <select id="setting-choices" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 appearance-none">
                        <option value="2">2択</option>
                        <option value="3">3択</option>
                        <option value="4" selected>4択</option>
                        <option value="5">5択</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button onclick="closeSettingsModal()" class="flex-1 py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">キャンセル</button>
                <button onclick="applySettings()" class="flex-1 py-2.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition shadow-md shadow-blue-500/20">適用する</button>
            </div>
            <p class="text-[10px] text-rose-500 text-center mt-3">※設定を変更すると、現在の入力内容はすべてリセットされます。</p>
        </div>
    </div>

    <!-- BATCH PASTE MODAL -->
    <div id="batch-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-200" id="batch-modal-card">
            
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    解答一括ペースト
                </h3>
                <button onclick="closeBatchModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <p class="text-xs text-slate-500 mb-3" id="batch-modal-desc">
                設定中の形式の文字列を貼り付けると自動反映されます。
            </p>

            <textarea id="batch-input" rows="5" class="w-full text-sm p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none font-mono tracking-widest text-slate-800 bg-slate-50 mb-4 resize-none transition-all duration-300" placeholder="ここに文字列を貼り付け..."></textarea>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                <div class="flex flex-wrap gap-1.5 w-full sm:w-auto" id="batch-quick-actions">
                    <!-- Quick actions injected dynamically -->
                </div>

                <div class="flex gap-2 w-full sm:w-auto justify-end">
                    <button id="batch-btn-user" onclick="handleBatchApply('user')" class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-xl transition flex items-center justify-center gap-1.5">
                        「あなたの解答」に適用
                    </button>
                    <button id="batch-btn-key" onclick="handleBatchApply('key')" class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition shadow-md shadow-blue-500/20 flex items-center justify-center gap-1.5">
                        「正解」に適用
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // State
        let state = {
            totalQuestions: 50,
            format: 'OX', // 'OX', 'ALPHA', 'NUM'
            choices: 4, // 2 to 5 (Ignored for OX)
            questions: [],
            isGraded: false,
            currentFilter: 'all'
        };

        // DOM Elements
        const gridContainer = document.getElementById('questions-grid');
        const emptyState = document.getElementById('empty-state');
        const scoreBanner = document.getElementById('score-banner');
        gridContainer.addEventListener('click', (e) => {
            const b = e.target.closest('button[data-field]');
            if (!b) return;
            setAnswer(parseInt(b.dataset.id, 10), b.dataset.field, b.dataset.val);
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            if (state.questions.length !== state.totalQuestions) {
                initializeQuestions();
            }
            updateGlobalUI();
            renderGrid();
            updateProgressCounts();
            if (state.isGraded) calculateAndDisplayScore(false);
        });

        function initializeQuestions() {
            state.questions = Array.from({ length: state.totalQuestions }, (_, i) => ({
                id: i + 1,
                userAnswer: null,
                correctAnswer: null,
            }));
            state.isGraded = false;
        }

        // Available options based on format
        function getOptions() {
            if (state.format === 'OX') return [{v: 'O', l: '〇'}, {v: 'X', l: '×'}];
            
            const arr = [];
            const count = Math.min(Math.max(state.choices, 2), 5); // clamp 2-5
            
            for(let i=0; i<count; i++) {
                if(state.format === 'ALPHA') {
                    const char = String.fromCharCode(65 + i); // A, B, C...
                    arr.push({v: char, l: char});
                } else if (state.format === 'NUM') {
                    const num = String(i + 1); // 1, 2, 3...
                    arr.push({v: num, l: num});
                }
            }
            return arr;
        }

        // Setup generic UI texts based on state
        function updateGlobalUI() {
            document.getElementById('header-title').textContent = `${state.totalQuestions}問 自動採点`;
            document.querySelectorAll('.footer-total').forEach(el => el.textContent = state.totalQuestions);
            document.getElementById('score-total').textContent = state.totalQuestions;
            document.getElementById('badge-all-total').textContent = `(${state.totalQuestions})`;
            
            // Build Jump Buttons
            const jumpContainer = document.getElementById('jump-buttons');
            jumpContainer.innerHTML = '';
            for (let i = 1; i <= state.totalQuestions; i += 10) {
                const btn = document.createElement('button');
                btn.className = "px-2 py-1 bg-white border border-slate-200 rounded hover:bg-slate-100 whitespace-nowrap";
                btn.textContent = `${i}~`;
                btn.onclick = () => scrollToQuestion(i);
                jumpContainer.appendChild(btn);
            }

            // Setup Quick Fill Buttons in Batch Modal
            const quickActions = document.getElementById('batch-quick-actions');
            quickActions.innerHTML = '';
            const opts = getOptions();
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "px-2.5 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 flex-1 min-w-[3rem]";
                btn.textContent = `すべて${opt.l}`;
                btn.onclick = () => quickFillBatch(opt.v);
                quickActions.appendChild(btn);
            });
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('tf_grader_state_v2', JSON.stringify({
                    totalQuestions: state.totalQuestions,
                    format: state.format,
                    choices: state.choices,
                    questions: state.questions,
                    isGraded: state.isGraded
                }));
            } catch (e) {
                console.warn('LocalStorage unavailable');
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('tf_grader_state_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const total = (Number.isInteger(parsed.totalQuestions) && parsed.totalQuestions >= 1 && parsed.totalQuestions <= 100) ? parsed.totalQuestions : 50;
                    state.totalQuestions = total;
                    state.format = ['OX', 'ALPHA', 'NUM'].includes(parsed.format) ? parsed.format : 'OX';
                    state.choices = (Number.isInteger(parsed.choices) && parsed.choices >= 2 && parsed.choices <= 5) ? parsed.choices : 4;
                    const valid = getOptions().map(o => o.v);
                    const clean = (v) => (typeof v === 'string' && valid.includes(v)) ? v : null;
                    const savedQs = Array.isArray(parsed.questions) ? parsed.questions : [];
                    state.questions = Array.from({ length: total }, (_, i) => {
                        const q = (savedQs[i] && typeof savedQs[i] === 'object') ? savedQs[i] : {};
                        return { id: i + 1, userAnswer: clean(q.userAnswer), correctAnswer: clean(q.correctAnswer) };
                    });
                    state.isGraded = parsed.isGraded === true;
                }
            } catch (e) {
                console.warn('Failed to load LocalStorage');
            }
        }

        // Render Grid
        function renderGrid() {
            gridContainer.innerHTML = '';
            let visibleCount = 0;
            const opts = getOptions();

            state.questions.forEach((q) => {
                const isCorrect = q.userAnswer && q.correctAnswer && (q.userAnswer === q.correctAnswer);
                const isIncorrect = q.userAnswer && q.correctAnswer && (q.userAnswer !== q.correctAnswer);
                const isUnanswered = !q.userAnswer || !q.correctAnswer;

                let matchesFilter = true;
                if (state.currentFilter === 'incorrect') matchesFilter = state.isGraded && isIncorrect;
                else if (state.currentFilter === 'correct') matchesFilter = state.isGraded && isCorrect;
                else if (state.currentFilter === 'unanswered') matchesFilter = isUnanswered;

                if (!matchesFilter) return;
                visibleCount++;

                let cardBgClass = "bg-white border-slate-200";
                let statusBadgeHTML = '<span class="text-xs text-slate-300 font-bold">-</span>';

                if (state.isGraded) {
                    if (isCorrect) {
                        cardBgClass = "bg-emerald-50/60 border-emerald-300 custom-ring-correct";
                        statusBadgeHTML = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-extrabold bg-emerald-500 text-white shadow-sm">正解</span>`;
                    } else if (isIncorrect) {
                        cardBgClass = "bg-rose-50/60 border-rose-300 custom-ring-incorrect";
                        statusBadgeHTML = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-extrabold bg-rose-500 text-white shadow-sm">不正解</span>`;
                    } else {
                        statusBadgeHTML = `<span class="text-[10px] text-slate-400 font-semibold bg-slate-100 px-1.5 py-0.5 rounded">未完了</span>`;
                    }
                }

                // Generate Button HTML based on options length
                const genButtons = (field) => {
                    const activeColorClass = field === 'userAnswer' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30' : 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30';
                    return opts.map(opt => `
                        <button data-id="${q.id}" data-field="${field}" data-val="${opt.v}" 
                            class="flex-1 py-1 sm:py-1.5 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${q[field] === opt.v ? activeColorClass : 'text-slate-600 hover:bg-slate-200 hover:text-slate-900'}">
                            ${opt.l}
                        </button>
                    `).join('');
                };

                const card = document.createElement('div');
                card.id = `q-card-${q.id}`;
                card.className = `q-card ${cardBgClass} border rounded-2xl p-3 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2 sm:gap-3`;

                card.innerHTML = `
                    <div class="flex items-center justify-between sm:justify-start gap-2 sm:w-12 shrink-0">
                        <span class="w-8 h-8 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-xs text-slate-700">
                            ${q.id}
                        </span>
                        <div class="sm:hidden">${statusBadgeHTML}</div>
                    </div>

                    <div class="flex-1 grid grid-cols-2 gap-2 sm:gap-4 items-center">
                        <div class="flex flex-col items-center w-full">
                            <span class="text-[9px] font-bold text-slate-400 uppercase mb-1">あなたの解答</span>
                            <div class="flex p-0.5 sm:p-1 bg-slate-100 rounded-xl w-full border border-slate-200/80 max-w-[180px]">
                                ${genButtons('userAnswer')}
                            </div>
                        </div>
                        <div class="flex flex-col items-center w-full">
                            <span class="text-[9px] font-bold text-slate-400 uppercase mb-1">正解 (キー)</span>
                            <div class="flex p-0.5 sm:p-1 bg-slate-100 rounded-xl w-full border border-slate-200/80 max-w-[180px]">
                                ${genButtons('correctAnswer')}
                            </div>
                        </div>
                    </div>

                    <div class="hidden sm:flex items-center justify-center w-16 shrink-0 text-center">
                        ${statusBadgeHTML}
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            if (visibleCount === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        function setAnswer(id, field, value) {
            if (field !== 'userAnswer' && field !== 'correctAnswer') return;
            if (!getOptions().some(o => o.v === value)) return;
            const index = state.questions.findIndex(q => q.id === id);
            if (index === -1) return;
            if (state.questions[index][field] === value) {
                state.questions[index][field] = null;
            } else {
                state.questions[index][field] = value;
            }
            if (state.isGraded) {
                state.isGraded = false;
                scoreBanner.classList.add('hidden');
            }
            saveToLocalStorage();
            renderGrid();
            updateProgressCounts();
        }

        function updateProgressCounts() {
            const userAnsCount = state.questions.filter(q => q.userAnswer !== null).length;
            const keyAnsCount = state.questions.filter(q => q.correctAnswer !== null).length;
            document.getElementById('footer-user-count').textContent = userAnsCount;
            document.getElementById('footer-key-count').textContent = keyAnsCount;
        }

        function gradeAll() {
            const unansweredUser = state.questions.filter(q => q.userAnswer === null).length;
            const unansweredKey = state.questions.filter(q => q.correctAnswer === null).length;

            if (unansweredKey === state.totalQuestions && unansweredUser === state.totalQuestions) {
                showToast('「あなたの解答」または「正解」を入力してください', 'warning');
                return;
            }
            if (unansweredKey > 0 || unansweredUser > 0) {
                showToast(`未入力があります (解答:${unansweredUser}問, 正解:${unansweredKey}問)`, 'info');
            }

            state.isGraded = true;
            saveToLocalStorage();
            renderGrid();
            calculateAndDisplayScore(true);
            showToast('採点が完了しました！', 'success');
        }

        function calculateAndDisplayScore(scroll = false) {
            let correct = 0; let incorrect = 0; let unanswered = 0;
            state.questions.forEach(q => {
                if (q.userAnswer && q.correctAnswer) {
                    if (q.userAnswer === q.correctAnswer) correct++;
                    else incorrect++;
                } else {
                    unanswered++;
                }
            });

            const percentage = Math.round((correct / state.totalQuestions) * 100);

            document.getElementById('score-num').textContent = correct;
            document.getElementById('score-percent').textContent = `${percentage}%`;
            document.getElementById('stat-correct').textContent = correct;
            document.getElementById('stat-incorrect').textContent = incorrect;
            document.getElementById('stat-unanswered').textContent = unanswered;
            document.getElementById('badge-incorrect').textContent = incorrect > 0 ? `(${incorrect})` : '';

            const ring = document.getElementById('score-ring');
            const circumference = 2 * Math.PI * 38;
            ring.style.strokeDasharray = `${circumference}`;
            ring.style.strokeDashoffset = `${circumference - (percentage / 100) * circumference}`;

            const evalEl = document.getElementById('score-evaluation');
            if (percentage === 100) evalEl.textContent = '素晴らしい！満点合格です！🎉';
            else if (percentage >= 80) evalEl.textContent = '高得点！合格ライン達成です！✨';
            else if (percentage >= 60) evalEl.textContent = 'あと少し！復習して満点を目指そう！💪';
            else evalEl.textContent = '間違えた問題を中心に復習しましょう！📖';

            scoreBanner.classList.remove('hidden');
            if (scroll) scoreBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function setFilter(filter) {
            state.currentFilter = filter;
            ['all', 'incorrect', 'correct', 'unanswered'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) btn.className = "px-3.5 py-1.5 rounded-lg tab-btn bg-white text-slate-900 shadow-sm font-bold";
                else btn.className = "px-3.5 py-1.5 rounded-lg tab-btn hover:text-slate-900 font-semibold";
            });
            renderGrid();
        }

        function scrollToQuestion(id) {
            const el = document.getElementById(`q-card-${id}`);
            if (el) {
                // Ensure there is some offset so the header doesn't cover it
                const y = el.getBoundingClientRect().top + window.scrollY - 80;
                window.scrollTo({top: y, behavior: 'smooth'});
            }
        }

        /* --- SETTINGS --- */
        function openSettingsModal() {
            document.getElementById('setting-q-count').value = state.totalQuestions;
            document.getElementById('setting-format').value = state.format;
            document.getElementById('setting-choices').value = state.choices;
            toggleChoicesSelect();

            const modal = document.getElementById('settings-modal');
            const card = document.getElementById('settings-modal-card');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }
        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const card = document.getElementById('settings-modal-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }
        function toggleChoicesSelect() {
            const fmt = document.getElementById('setting-format').value;
            const container = document.getElementById('setting-choices-container');
            if (fmt === 'OX') {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
            }
        }
        function applySettings() {
            const newQCount = parseInt(document.getElementById('setting-q-count').value, 10);
            const newFormat = document.getElementById('setting-format').value;
            const newChoices = parseInt(document.getElementById('setting-choices').value, 10);

            if (isNaN(newQCount) || newQCount < 1 || newQCount > 100) {
                showToast('問題数は1〜100の間で入力してください', 'error');
                return;
            }

            if (newQCount !== state.totalQuestions || newFormat !== state.format || (newFormat !== 'OX' && newChoices !== state.choices)) {
                if(!confirmModal('設定を変更すると現在の入力内容はすべてリセットされます。よろしいですか？')) return;
                
                state.totalQuestions = newQCount;
                state.format = newFormat;
                state.choices = newChoices;
                
                initializeQuestions();
                saveToLocalStorage();
                updateGlobalUI();
                renderGrid();
                updateProgressCounts();
                scoreBanner.classList.add('hidden');
                showToast('設定を更新し、データをリセットしました', 'success');
            }
            closeSettingsModal();
        }

        /* --- BATCH PASTE --- */
        function openBatchModal() {
            const modal = document.getElementById('batch-modal');
            const card = document.getElementById('batch-modal-card');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
            setBatchPlaceholder();
        }
        function closeBatchModal() {
            const modal = document.getElementById('batch-modal');
            const card = document.getElementById('batch-modal-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }
        function quickFillBatch(val) {
            document.getElementById('batch-input').value = val.repeat(state.totalQuestions);
        }
        function setBatchPlaceholder() {
            const formatHint = getOptions().map(o => o.l).join('や');
            document.getElementById('batch-input').placeholder = `ここに${formatHint}などの文字列を連続で貼り付けてください...`;
        }

        function handleBatchApply(targetField) {
            const text = document.getElementById('batch-input').value;
            if (!text.trim()) {
                showToast('文字を入力してください', 'warning');
                return;
            }
            applyBatch(text, targetField);
        }

        function applyBatch(text, targetField) {
            const validVals = getOptions().map(o=>o.v);
            const parsed = [];
            
            for (let i=0; i<text.length; i++) {
                const char = text[i].toUpperCase();
                // Specific matching logic based on format
                if (state.format === 'OX') {
                    if (['〇','O','0','1','T','オ','マ'].includes(char)) parsed.push('O');
                    else if (['×','X','2','F','バ'].includes(char)) parsed.push('X');
                } else if (state.format === 'ALPHA') {
                    // accept full-width alphabet as well by matching char codes
                    const code = text.charCodeAt(i);
                    // A-Z is 65-90, Ａ-Ｚ is 65313-65338
                    let normChar = char;
                    if (code >= 65313 && code <= 65338) normChar = String.fromCharCode(code - 65248);
                    
                    if (validVals.includes(normChar)) parsed.push(normChar);
                } else if (state.format === 'NUM') {
                    const code = text.charCodeAt(i);
                    // 1-9 is 49-57, １-９ is 65297-65305
                    let normChar = char;
                    if (code >= 65297 && code <= 65305) normChar = String.fromCharCode(code - 65248);
                    
                    if (validVals.includes(normChar)) parsed.push(normChar);
                }
                if (parsed.length >= state.totalQuestions) break;
            }

            if (parsed.length === 0) {
                showToast('有効な文字が見つかりませんでした', 'error');
                return;
            }

            parsed.forEach((val, idx) => {
                if (targetField === 'user') state.questions[idx].userAnswer = val;
                else state.questions[idx].correctAnswer = val;
            });

            if (state.isGraded) {
                state.isGraded = false;
                scoreBanner.classList.add('hidden');
            }
            saveToLocalStorage();
            renderGrid();
            updateProgressCounts();
            closeBatchModal();
            showToast(`${parsed.length}問分を反映しました`, 'success');
        }

        /* --- UTILS --- */
        function confirmReset() {
            if (confirmModal('すべての解答データをクリアしますか？（※設定は保持されます）')) {
                initializeQuestions();
                saveToLocalStorage();
                renderGrid();
                updateProgressCounts();
                scoreBanner.classList.add('hidden');
                showToast('データをリセットしました', 'info');
            }
        }

        function copyResultSummary() {
            let correct = 0;
            state.questions.forEach(q => {
                if (q.userAnswer && q.correctAnswer && q.userAnswer === q.correctAnswer) correct++;
            });
            const percent = Math.round((correct / state.totalQuestions) * 100);

            const formatLabel = (v) => {
                if(!v) return '-';
                if(state.format === 'OX') return v === 'O' ? '〇' : '×';
                return v;
            }

            let summaryText = `【自動採点結果】\n正解数: ${correct} / ${state.totalQuestions}問 (${percent}%)\n\n`;
            state.questions.forEach(q => {
                const u = formatLabel(q.userAnswer);
                const k = formatLabel(q.correctAnswer);
                const mark = (q.userAnswer && q.correctAnswer) ? (q.userAnswer === q.correctAnswer ? '〇' : '×') : '未';
                summaryText += `Q${q.id}: [答]${u} [正]${k} (${mark})\n`;
            });

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(summaryText).then(() => showToast('結果をクリップボードにコピーしました', 'success'))
                .catch(() => fallbackCopy(summaryText));
            } else {
                fallbackCopy(summaryText);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('結果をコピーしました', 'success');
            } catch (err) {
                showToast('コピーに失敗しました', 'error');
            }
            document.body.removeChild(textarea);
        }

        function confirmModal(message) { return window.confirm(message); }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bg = 'bg-slate-800 text-white';
            if (type === 'success') bg = 'bg-emerald-600 text-white';
            if (type === 'warning') bg = 'bg-amber-500 text-white';
            if (type === 'error') bg = 'bg-rose-600 text-white';
            toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold transition-all transform translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
