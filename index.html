<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリを選ぶ</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --text: #1c2630;
    --muted: #5d6b79;
    --line: #d9e0e6;
    --accent: #0b7a75;
    --accent-bg: #e3f3f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181e;
      --surface: #1b232b;
      --text: #e8edf1;
      --muted: #9aa8b5;
      --line: #2c3742;
      --accent: #4fd1c5;
      --accent-bg: #16302f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.6;
    padding: 32px 16px 64px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  input[type="search"] {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  input[type="search"]:focus-visible,
  a.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.item {
    display: block;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
  }
  a.item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .name { font-weight: 700; }
  .desc { color: var(--muted); font-size: .9rem; }
  .host { color: var(--accent); font-size: .8rem; word-break: break-all; }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>アプリを選ぶ</h1>
  <p class="sub">開きたいアプリをタップしてください。</p>
  <input type="search" id="q" placeholder="名前で絞り込み" aria-label="名前で絞り込み" autocomplete="off">
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>見つかりませんでした。</p>
</main>

<script>
/* ============================================================
   ここにURLを追加するだけ！
   1行コピーして、name / url / desc を書き換えてください。
   - name: 表示名（省略するとURLのドメイン名を表示）
   - url : https:// から始まるURL（必須）
   - desc: ひとこと説明（省略可）
   ============================================================ */
const APPS = [
  { name: "電子レンジ時間計算アプリ", url: "https://takik616.github.io/public/microe-wave/", desc: "記載してるワット数が対応してない？ これは、あなたの家の電子レンジでのレンチン時間がすぐわかる！" },
  { name: "答え合わせアプリ", url: "https://takik616.github.io/public/maru-batu/", desc: "ドリルなどに直接答えを書き込みたくないときにこれを使ってね！" },
  // { name: "", url: "https://example.com/", desc: "" },
];
/* ============================================================ */

(function () {
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var q = document.getElementById("q");

  // http / https 以外（javascript: など）は表示しない
  function parse(u) {
    try {
      var x = new URL(u, location.href);
      return (x.protocol === "https:" || x.protocol === "http:") ? x : null;
    } catch (e) { return null; }
  }

  var items = APPS.map(function (a) {
    var u = parse(a.url);
    if (!u) return null;
    return {
      name: a.name || u.hostname,
      desc: a.desc || "",
      href: u.href,
      host: u.host + (u.pathname !== "/" ? u.pathname : "")
    };
  }).filter(Boolean);

  function render(filter) {
    list.textContent = "";
    var f = (filter || "").trim().toLowerCase();
    var shown = items.filter(function (i) {
      return !f || (i.name + " " + i.desc + " " + i.host).toLowerCase().indexOf(f) !== -1;
    });
    shown.forEach(function (i) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "item";
      a.href = i.href;
      a.rel = "noopener noreferrer";
      var n = document.createElement("div"); n.className = "name"; n.textContent = i.name;
      a.appendChild(n);
      if (i.desc) {
        var d = document.createElement("div"); d.className = "desc"; d.textContent = i.desc;
        a.appendChild(d);
      }
      var h = document.createElement("div"); h.className = "host"; h.textContent = i.host;
      a.appendChild(h);
      li.appendChild(a);
      list.appendChild(li);
    });
    empty.hidden = shown.length > 0;
  }

  q.addEventListener("input", function () { render(q.value); });
  render("");
})();
</script>
</body>
</html>
